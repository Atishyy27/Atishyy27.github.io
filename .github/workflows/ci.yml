name: ci

# Builds any branch and pull request on GitHub's runners, and never deploys.
# This is the staging gate: a change is proven to compile in the cloud before it
# is merged to main, so a broken build fails here instead of on the live site,
# and nothing has to be built on a laptop.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything in `npm run verify` that needs no build, plus the type-checker and
  # the unit tests. Node 22 because these read the app's TypeScript directly;
  # the build job below stays on 20. check:resume is not here: it is red on main
  # for a content reason (the published résumé PDF) that is his call, not a code one.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:fast

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # The open-source numbers must agree everywhere before this can be merged.
      - run: node scripts/check-oss-numbers.mjs
