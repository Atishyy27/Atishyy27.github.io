name: refresh-stats

# Refreshes every number the site states about open source, competitive programming,
# store users and the GitHub activity graph, then redeploys the site if anything changed.
#
# Hourly. GitHub's own scheduler often runs late, so treat it as "within a few hours".
#
# THE DEPLOY STEP IS LOAD-BEARING. A push made with the default GITHUB_TOKEN does not
# start other workflows (workflow_dispatch is the one exception), and this commit used
# to carry [skip ci] as well, so for weeks the data was committed and the live site
# never rebuilt. The last step dispatches deploy.yml explicitly.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The two that carry the open-source numbers. If either fails the run goes red
      # and nothing is committed, so the site never shows half-new data.
      - name: Open source pull requests, contributions, scorecard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-oss.mjs

      - name: Open source issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-issues.mjs

      # The rest are nice to have. A failure here is reported at the end, after the
      # numbers above have been published.
      - name: Competitive programming ratings
        id: cp
        continue-on-error: true
        run: node scripts/gen-cp.mjs

      - name: GitHub activity graph
        id: activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-activity.mjs

      - name: Chrome Web Store user counts
        id: store
        continue-on-error: true
        run: node scripts/fetch-store-users.mjs

      - name: Check the numbers agree before committing
        run: node scripts/check-oss-numbers.mjs --data-only

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/oss-data.json src/content/oss-stats.ts src/content/oss-scorecard.json src/content/oss-prs.json src/content/oss-issues.json src/content/cp.ts src/content/activity.ts src/content/store.ts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changed, nothing to publish."
          else
            git commit -m "chore(data): automated dynamic stats refresh"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Report optional steps that failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.cp.outcome }}" = "failure" ] && failed="$failed cp"
          [ "${{ steps.activity.outcome }}" = "failure" ] && failed="$failed activity"
          [ "${{ steps.store.outcome }}" = "failure" ] && failed="$failed store-users"
          if [ -n "$failed" ]; then
            echo "Optional steps failed:$failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
