<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AJ">
  <!-- The same mark as the nav: AJ, with the accent on the full stop. Drawn as
       paths rather than <text> because a favicon is rendered outside the page
       and cannot rely on a webfont; a text element here falls back to whatever
       the OS happens to have and the two letters stop lining up.
       Sized for 16px first: the strokes are heavy and the counters are open,
       because at tab size a thin geometric mark turns into a grey smudge. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0b"/>
  <g fill="none" stroke="#ededee" stroke-width="6.5" stroke-linecap="square">
    <!-- A -->
    <path d="M9 45 L17.5 19 L26 45"/>
    <path d="M11.6 35.2 H24.4"/>
    <!-- J -->
    <path d="M45 19 V37.5 A6.5 6.5 0 0 1 34 42.2"/>
  </g>
  <circle cx="54" cy="42" r="4.6" fill="#5eb3b3"/>
</svg>
